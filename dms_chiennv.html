<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SandboxVN · Sale DMS Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --brand:#1a5276;--brand-dark:#0e3556;--brand-light:#2e86c1;--accent:#d4ac0d;
  --bg:#f3f6fa;--card:#fff;--text:#0d1f35;--muted:#64748b;--border:#e2e8f0;--soft:#f8fafc;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb;--purple:#7c3aed;--gray:#94a3b8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--brand-dark);color:#c6d8e8;position:sticky;top:0;height:100vh;overflow:auto;padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;color:#fff}
.logo .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand-light),var(--accent));display:grid;place-items:center;font-weight:700;font-size:15px}
.logo b{display:block;font-size:15px}.logo small{font-size:11.5px;opacity:.7}
.nav-sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.5;padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:inherit;text-decoration:none;cursor:pointer;font-size:13.5px}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(255,255,255,.14);color:#fff;font-weight:500}
.nav .num{font-size:11px;opacity:.55;width:16px}
.nav .tag{margin-left:auto;font-size:9.5px;padding:1px 6px;border-radius:10px;background:rgba(255,255,255,.1);opacity:.85}
.side-foot{margin-top:auto;font-size:11.5px;opacity:.6;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.1)}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.top{height:60px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:1000}
.top h1{font-size:17px;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .clock{color:var(--muted);font-size:12.5px;white-space:nowrap}
.top .sp{flex:1}
.seg{display:inline-flex;background:#eef2f7;border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;font-size:12.5px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button.on{background:#fff;color:var(--brand);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bell{position:relative;border:1px solid var(--border);background:#fff;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.bell em{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-style:normal;font-size:10.5px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.user{display:flex;align-items:center;gap:8px;font-size:12.5px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:12px;flex:none}
.content{padding:20px;flex:1;min-width:0}
/* generic */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .sub{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:auto}
.qhead{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.qhead:first-child{margin-top:0}
.qhead h2{font-size:15.5px;margin:0}
.qhead span{color:var(--muted);font-size:12.5px}
.g2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.g2e{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--brand-light))}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi .v{font-size:26px;font-weight:700;margin-top:2px;letter-spacing:-.01em}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted)}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--brand-light)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%}
.schip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.schip i{width:9px;height:9px;border-radius:3px;display:inline-block}
.muted{color:var(--muted)}.small{font-size:12px}.b{font-weight:600}
.tbl{overflow:auto;border:1px solid var(--border);border-radius:10px;background:#fff}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--border);background:var(--soft);position:sticky;top:0;z-index:1;white-space:nowrap}
.t td{padding:9px 10px;border-bottom:1px solid #eef2f7;vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.click:hover td{background:#f4f9fe;cursor:pointer}
.t td.num,.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--border);background:#fff;padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{border-color:#b9c8d8}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:var(--brand-dark)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:#fff;border-color:#fecaca;color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input,textarea{font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:#fff;color:inherit;min-width:0}
textarea{resize:vertical;width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f>select,label.f>input,label.f>textarea{color:var(--text)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar{height:8px;background:#eef2f7;border-radius:6px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:6px}
.hbar{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;margin:7px 0;font-size:12.5px}
.hbar .bar{height:12px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #eef2f7;align-items:flex-start;font-size:13px}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer}.li.click:hover{background:#f7fafd}
.li .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:13px}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.tip{background:#eef6fd;border:1px solid #cfe3f5;color:#174a74;padding:10px 14px;border-radius:10px;font-size:12.5px;margin-bottom:16px;display:flex;gap:10px;align-items:center}
.empty{padding:30px;text-align:center;color:var(--muted)}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:6px;background:#fef2f2;color:var(--bad);border:1px solid #fecaca;white-space:nowrap}
.okb{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:6px;background:#f0fdf4;color:var(--ok);border:1px solid #bbf7d0;white-space:nowrap}
/* map */
.mapwrap{display:grid;grid-template-columns:260px 1fr;gap:14px;height:calc(100vh - 100px);min-height:520px}
.filters{overflow:auto;display:flex;flex-direction:column;gap:10px}
.filters h4{margin:6px 0 0;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mapbox{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:#e8eef4}
#map{position:absolute;inset:0}
.legend{position:absolute;right:12px;bottom:12px;z-index:500;background:#fff;border-radius:10px;padding:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.12);font-size:12px;max-width:220px}
.legend div{display:flex;align-items:center;gap:7px;margin:3px 0}
.legend i{width:11px;height:11px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.mapstat{position:absolute;left:12px;top:12px;z-index:500;background:#fff;border-radius:10px;padding:8px 12px;box-shadow:0 2px 10px rgba(0,0,0,.12);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap;max-width:calc(100% - 80px)}
.mapstat b{font-size:14px}
.mk{position:relative;width:14px;height:14px}
.mk b{display:block;width:14px;height:14px;border-radius:50%;background:var(--c);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.mk.un b{border:2px dashed #fff;box-shadow:0 0 0 1.5px var(--bad)}
.mk span{position:absolute;left:14px;top:-4px;font-size:10px;font-weight:600;background:#fff;border:1px solid #cbd5e1;border-left:3px solid var(--s);padding:0 4px;border-radius:4px;white-space:nowrap;color:#0f172a;line-height:15px}
.nolabels .mk span{display:none}
.salepin{width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 0 0 2px var(--c),0 3px 8px rgba(0,0,0,.3);position:relative}
.salepin:after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--c);opacity:.5;animation:pulse 1.8s infinite}
@keyframes pulse{from{transform:scale(.6);opacity:.7}to{transform:scale(1.3);opacity:0}}
.stopnum{width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.leaflet-popup-content{margin:12px 14px;font-family:'Be Vietnam Pro',sans-serif;font-size:12.5px;line-height:1.5}
.pop h5{margin:0 0 4px;font-size:14px}
.pop .kv{display:grid;grid-template-columns:92px 1fr;gap:2px 8px;margin:8px 0}
.pop .kv span{color:var(--muted)}
/* drawer & modal */
.ov{position:fixed;inset:0;background:rgba(13,31,53,.35);z-index:2000;display:none}
.ov.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:#fff;z-index:2001;transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.12)}
.drawer.on{transform:none}
.dh{padding:18px 20px 12px;border-bottom:1px solid var(--border)}
.dh h2{margin:0;font-size:18px}
.db{padding:16px 20px;overflow:auto;flex:1}
.x{border:0;background:#f1f5f9;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;line-height:1;flex:none}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));max-height:calc(100vh - 40px);background:#fff;border-radius:14px;z-index:2101;display:none;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.on{display:flex}
.modal .mh{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal .mh h3{margin:0;font-size:16px;flex:1}
.modal .mb{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
#mov{z-index:2100}
.kvg{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:13px}
.kvg>span:nth-child(odd){color:var(--muted)}
/* timeline */
.tl-month{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}
.ev{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fff;position:relative}
.ev-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;margin-bottom:6px}
.ev-h .dt{margin-left:auto;color:var(--muted);font-size:12px}
.log{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.log div{display:grid;grid-template-columns:44px 84px 1fr;gap:6px;align-items:baseline}
.log .tm{color:var(--muted);font-variant-numeric:tabular-nums}
.log .k{font-weight:600}
.ev.sys{background:var(--soft)}
.ev.sys .ev-h{margin:0}
/* toast */
#toasts{position:fixed;right:16px;bottom:16px;z-index:3000;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:var(--brand-dark);color:#fff;padding:10px 14px;border-radius:10px;font-size:12.5px;box-shadow:0 8px 20px rgba(0,0,0,.2);animation:tin .25s}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
.notif-panel{position:absolute;right:20px;top:56px;width:380px;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.15);display:none;z-index:1100}
.notif-panel.on{display:block}
.notif-panel .nh{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff}
.nitem{padding:10px 14px;border-bottom:1px solid #f1f5f9;font-size:12.5px;cursor:pointer;display:flex;gap:10px}
.nitem:hover{background:#f7fafd}
.nitem.unread{background:#f0f7ff}
/* routes */
.rgrid{display:grid;grid-template-columns:320px 1fr;gap:16px}
.rcard{border:1px solid var(--border);border-radius:10px;padding:11px 12px;cursor:pointer;background:#fff;margin-bottom:8px}
.rcard:hover{border-color:#b9c8d8}
.rcard.on{border-color:var(--brand);box-shadow:0 0 0 2px #1a527622}
.days{display:inline-flex;gap:3px}
.days i{font-style:normal;font-size:10.5px;width:24px;text-align:center;padding:1px 0;border-radius:5px;background:#eef2f7;color:#94a3b8}
.days i.on{background:var(--brand);color:#fff}
.stops .li{align-items:center}
.sn{width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
#routeMap{height:280px;border-radius:10px;border:1px solid var(--border)}
/* calendar */
.cal{display:grid;grid-template-columns:180px repeat(7,minmax(110px,1fr));border:1px solid var(--border);border-radius:10px;overflow:auto;background:#fff}
.cal>div{padding:8px;border-right:1px solid #eef2f7;border-bottom:1px solid #eef2f7;min-height:74px;font-size:12px}
.cal .ch{min-height:auto;background:var(--soft);font-weight:600;font-size:12px;color:var(--muted)}
.cal .ch.today{color:var(--brand);background:#e8f2fb}
.cal .cc{cursor:pointer}.cal .cc:hover{background:#f7fafd}
.cal .today-col{background:#f5faff}
.cblk{border-radius:7px;padding:5px 7px;margin-bottom:4px;border-left:3px solid var(--c);background:#f8fafc}
.cblk b{display:block;font-size:12px}
/* mobile */
.mob{display:grid;grid-template-columns:1fr 380px 1fr;gap:20px;align-items:start}
.phone{width:360px;height:740px;border-radius:44px;border:11px solid #111827;background:#f3f6fa;overflow:hidden;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.25);margin:0 auto;display:flex;flex-direction:column}
.phone .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:24px;background:#111827;border-radius:0 0 14px 14px;z-index:5}
.pbar{background:var(--brand);color:#fff;padding:32px 16px 14px;flex:none}
.pbar .t{font-size:16px;font-weight:600}
.pbar .s{font-size:12px;opacity:.8}
.pbar .back{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;margin-bottom:8px}
.pbody{flex:1;overflow:auto;padding:12px}
.pcard{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.pbtn{width:100%;border:0;border-radius:11px;padding:12px;font-weight:600;cursor:pointer;font-size:14px;background:var(--brand);color:#fff}
.pbtn.alt{background:#fff;color:var(--brand);border:1px solid #cfe0ee}
.pbtn.ok{background:var(--ok)}
.pbtn:disabled{opacity:.5;cursor:not-allowed}
.stop{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid #f1f5f9;cursor:pointer;font-size:13px}
.stop:last-child{border-bottom:0}
.stop .st{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;border:2px solid #cbd5e1;color:#64748b;background:#fff}
.stop.done .st{background:var(--ok);border-color:var(--ok);color:#fff}
.stop.skip .st{background:#fee2e2;border-color:#fca5a5;color:var(--bad)}
.stop.next .st{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 3px #1a527625}
.stop.prog .st{background:var(--warn);border-color:var(--warn);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.gpsbox{border-radius:10px;padding:10px 12px;font-size:12.5px;margin:8px 0}
.gpsbox.ok{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.gpsbox.warn{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
.gpsbox.bad{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.timer{font-size:34px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;color:var(--brand)}
.steps{counter-reset:s}
.steps li{list-style:none;position:relative;padding:0 0 14px 36px;font-size:13px}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:#e8f2fb;color:var(--brand);font-weight:700;display:grid;place-items:center;font-size:12px}
.steps li b{display:block}
.feed .nitem{cursor:pointer;border-radius:8px;border:1px solid #eef2f7;margin-bottom:6px;background:#fff}
/* settings */
.set-row{display:grid;grid-template-columns:240px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid #eef2f7;align-items:center}
.set-row:last-child{border-bottom:0}
.set-row .h b{display:block;font-size:13.5px}.set-row .h span{font-size:12px;color:var(--muted)}
input[type=range]{padding:0;border:0;accent-color:var(--brand)}
input[type=checkbox]{accent-color:var(--brand);width:16px;height:16px}
/* arch */
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow span{background:#e8f2fb;color:var(--brand-dark);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:500}
.flow em{color:var(--muted);font-style:normal}
.erd{width:100%;height:auto;background:#fff}
.phase{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;color:#fff}
@media (max-width:1200px){.mob{grid-template-columns:1fr}.mob>.side-col{order:2}.g2{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px;gap:2px}
  .logo,.nav-sec,.side-foot{display:none}
  .nav{display:flex;gap:2px}.nav a{white-space:nowrap}.nav .tag,.nav .num{display:none}

function mkVisit(o,sid,rid,day,inM,outM,opt={}){
  const far=opt.far||rnd()<0.035;
  const dist=far?rint(140,420):rint(4,70),acc=rint(5,28);
  const open=outM==null;
  const outcome=open?null:pickOutcome(o.status);
  const note=open?'':pick(NOTES[outcome]).replace('{p}',pick(PRODUCTS));
  const flags=[];if(far)flags.push('Ngoài bán kính');
  const v={id:'v'+(++vid),oid:o.id,sid,rid,date:day,inM,outM,dist,acc,flags,farReason:far?pick(FAR_REASONS):'',outcome,note,lat:o.lat,lng:o.lng};
  if(outM!=null&&outM-inM<5)v.flags.push('Visit quá ngắn');
  if(outcome&&ACTION_OF[outcome]){
    const due=dAdd(day,rint(2,6));
    const done=due<TODAY?rnd()<0.8:(rnd()<0.25);
    actions.push({id:'a'+(++aid),oid:o.id,vid:v.id,sid,title:ACTION_OF[outcome],due,status:done?'done':'open',created:day,doneAt:done?dAdd(due,-rint(0,2)):null});
    v.aid='a'+aid;
  }
  if(outcome==='Đặt hàng'){
    orders.push({id:'SO-'+pad(day.getMonth()+1)+pad(day.getDate())+'-'+String(++ordN).padStart(4,'0'),oid:o.id,vid:v.id,sid,date:day,amount:rint(18,260)*100000,items:rint(3,14),status:sameDay(day,TODAY)?'Chờ duyệt':'Đã giao'});
  }
  visits.push(v);return v;
}

function careOf(o){
  if(!o.last) return 'never';
  const ds=daysAgo(o.last.date),f=S.cfg.freq[o.status]||14;
  return ds<=f?'ok':ds<=f*1.5?'due':'overdue';

function reindex(){
  const by={};visits.forEach(v=>(by[v.oid]??=[]).push(v));
  const abo={};actions.forEach(a=>{if(a.status==='open')(abo[a.oid]??=[]).push(a)});
  outlets.forEach(o=>{

    o.visits=vs;o.visitCount=vs.length;o.last=vs[vs.length-1]||null;
    o.routeIds=routes.filter(r=>r.stops.some(s=>s.oid===o.id)).map(r=>r.id);
    o.open=(abo[o.id]||[]).sort((a,b)=>a.due-b.due);

function kpi(l,v,d,c,click){return `<div class="kpi ${click?'click':''}" style="--c:${c}" ${click?`onclick="${click}"`:''}><div class="l">${l}</div><div class="v">${v}</div><div class="d">${d}</div></div>`}

let mapLayer=null;
function gotoMap(f){Object.assign(S.mf,{sale:'',area:'',route:'',age:'',status:'',last:'',assigned:'',q:''},f);go('map')}
function mapFiltered(){
  const f=S.mf;let list=scopeOutlets();
  if(f.sale)list=list.filter(o=>o.saleId===f.sale);
  if(f.area)list=list.filter(o=>o.district===f.area);
  if(f.route)list=list.filter(o=>o.routeIds.includes(f.route));
  if(f.age)list=list.filter(o=>f.age==='new'?isNewCus(o):!isNewCus(o));
  if(f.status)list=list.filter(o=>o.status===f.status);
  if(f.assigned)list=list.filter(o=>f.assigned==='yes'?!!o.saleId:!o.saleId);
  if(f.last){list=list.filter(o=>{const d=o.last?daysAgo(o.last.date):9999;return f.last==='7'?d<=7:f.last==='30'?d<=30:f.last==='gt30'?d>30&&o.last:f.last==='never'?!o.last:(o.care==='overdue'||(o.care==='never'&&o.status!=='inactive'))})}
  if(f.q){const q=f.q.toLowerCase();list=list.filter(o=>(o.name+o.addr+o.code).toLowerCase().includes(q))}
  return list;
}
function colorFor(o){const b=S.mf.colorBy;if(b==='care')return CARE[o.care].c;if(b==='sale')return o.saleId?SALE(o.saleId).color:'#dc2626';return STATUS[o.status].c}
function rMap(c){
  const outs=scopeOutlets(),ss=scopeSales().map(SALE).filter(s=>!s.inactive);
  const rs=routes.filter(r=>inScopeSale(r.saleId)),areas=[...new Set(outs.map(o=>o.district))];
  const opt=(k,arr)=>arr.map(([v,l])=>`<option value="${v}" ${S.mf[k]===v?'selected':''}>${l}</option>`).join('');
  c.innerHTML=`<div class="mapwrap">
   <aside class="card filters">
     <input placeholder="Tìm điểm bán, địa chỉ, mã…" value="${esc(S.mf.q)}" oninput="S.mf.q=this.value;updateMapLayers()">
     <h4>Bộ lọc</h4>
     <label class="f">Sale phụ trách<select onchange="setMF('sale',this.value,1)"><option value="">Tất cả Sale</option>${opt('sale',ss.map(s=>[s.id,s.name]))}</select></label>
     <label class="f">Khu vực<select onchange="setMF('area',this.value,1)"><option value="">Tất cả khu vực</option>${opt('area',areas.map(a=>[a,a]))}</select></label>
     <label class="f">Tuyến<select onchange="setMF('route',this.value,1)"><option value="">Tất cả tuyến</option>${opt('route',rs.map(r=>[r.id,r.name+' · '+SALE(r.saleId).short]))}</select></label>
     <label class="f">Khách cũ / mới<select onchange="setMF('age',this.value)"><option value="">Tất cả</option>${opt('age',[['new','Khách mới (≤ 60 ngày)'],['old','Khách cũ']])}</select></label>
     <label class="f">Trạng thái khách hàng<select onchange="setMF('status',this.value)"><option value="">Tất cả trạng thái</option>${opt('status',Object.entries(STATUS).map(([k,v])=>[k,v.l]))}</select></label>
     <label class="f">Lần ghé gần nhất<select onchange="setMF('last',this.value)"><option value="">Bất kỳ</option>${opt('last',[['7','Trong 7 ngày'],['30','Trong 30 ngày'],['gt30','Trên 30 ngày'],['never','Chưa từng ghé'],['over','Quá hạn theo tần suất']])}</select></label>
     ${S.role==='admin'?`<label class="f">Sale phụ trách (có/không)<select onchange="setMF('assigned',this.value)"><option value="">Tất cả</option>${opt('assigned',[['yes','Đã có Sale'],['no','Chưa có Sale']])}</select></label>`:''}
     <h4>Hiển thị</h4>
     <label class="f">Tô màu điểm theo<select onchange="setMF('colorBy',this.value)">${opt('colorBy',[['status','Trạng thái khách hàng'],['care','Tình trạng chăm sóc'],['sale','Sale phụ trách']])}</select></label>
     <label class="row small"><input type="checkbox" ${S.mf.labels?'checked':''} onchange="setMF('labels',this.checked)"> Nhãn tên Sale cạnh điểm</label>
     <label class="row small"><input type="checkbox" ${S.mf.showSales?'checked':''} onchange="setMF('showSales',this.checked)"> Vị trí Sale hôm nay</label>
     <button class="btn sm" onclick="gotoMap({})">Xóa bộ lọc</button>
     <p class="muted small" style="margin:4px 0 0">Chọn một tuyến để xem thứ tự điểm và đường đi.</p>
   </aside>
   <div class="mapbox"><div id="map"></div><div class="mapstat" id="mapstat"></div><div class="legend" id="legend"></div></div>
  </div>`;
  if(!window.L){$('#map').innerHTML='<div class="empty" style="padding-top:120px">Không tải được thư viện bản đồ (cần kết nối Internet).<br>Các màn hình khác vẫn hoạt động bình thường.</div>';updateMapStat();return}
  MAP=L.map('map',{zoomControl:true}).setView([21.02,105.82],12);
  addBaseLayer(MAP);
  MAP.on('zoomend',()=>$('#map').classList.toggle('nolabels',!S.mf.labels||MAP.getZoom()<13));
  updateMapLayers(true);
}
// Nền bản đồ không cần API key: CARTO Voyager (rõ, có màu); nếu bị chặn/lỗi nhiều thì tự chuyển sang OSM chuẩn
function addBaseLayer(m){
  const voyager=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap, &copy; CARTO',subdomains:'abcd',maxZoom:19});
  let errs=0,ok=0,switched=false;
  voyager.on('tileload',()=>ok++);
  voyager.on('tileerror',()=>{
    if(switched||++errs<4||ok>errs)return;
    switched=true;m.removeLayer(voyager);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap',maxZoom:19}).addTo(m);
  });
  voyager.addTo(m);
  // Khung chứa có thể đổi kích thước sau khi render → tránh mảng xám thiếu ô bản đồ
  const fix=()=>{try{if(m.getContainer().isConnected)m.invalidateSize()}catch(e){}};
  setTimeout(fix,0);setTimeout(fix,300);
  if(window.ResizeObserver)new ResizeObserver(fix).observe(m.getContainer());
  return voyager;
}
function setMF(k,v,fit){S.mf[k]=v;if(k==='sale'&&v&&S.mf.route&&ROUTE(S.mf.route).saleId!==v)S.mf.route='';updateMapLayers(fit)}
function updateMapStat(){
  const l=mapFiltered();
  $('#mapstat').innerHTML=`<span><b>${l.length}</b> điểm</span><span><b style="color:#dc2626">${l.filter(o=>!o.saleId).length}</b> chưa có Sale</span><span><b style="color:#d97706">${l.filter(o=>o.care==='overdue').length}</b> lâu chưa ghé</span><span><b style="color:#16a34a">${l.filter(o=>o.last&&daysAgo(o.last.date)===0).length}</b> đã ghé hôm nay</span>`;
}
function updateMapLayers(fit){
  if(!$('#mapstat'))return;
  updateMapStat();
  const lg=S.mf.colorBy==='care'?Object.values(CARE):S.mf.colorBy==='sale'?scopeActive().map(id=>({l:SALE(id).name,c:SALE(id).color})).concat(S.role==='admin'?[{l:'Chưa có Sale',c:'#dc2626'}]:[]):Object.values(STATUS);
  $('#legend').innerHTML=`<b style="font-size:12px">${S.mf.colorBy==='care'?'Tình trạng chăm sóc':S.mf.colorBy==='sale'?'Sale phụ trách':'Trạng thái khách hàng'}</b>`+lg.map(x=>`<div><i style="background:${x.c}"></i>${x.l}</div>`).join('')+`<div style="margin-top:6px;border-top:1px solid #eee;padding-top:6px"><span style="font-size:10px;font-weight:600;border:1px solid #cbd5e1;border-left:3px solid #2563eb;padding:0 4px;border-radius:4px">An</span>&nbsp;Nhãn Sale phụ trách</div>`;
  if(!MAP)return;
  $('#map').classList.toggle('nolabels',!S.mf.labels||MAP.getZoom()<13);
  if(mapLayer)mapLayer.remove();
  mapLayer=L.layerGroup().addTo(MAP);
  const list=mapFiltered();
  if(S.mf.route){
    const r=ROUTE(S.mf.route),pts=r.stops.map(s=>OUT(s.oid)).map(o=>[o.lat,o.lng]);
    L.polyline(pts,{color:SALE(r.saleId).color,weight:4,opacity:.7,dashArray:'8 6'}).addTo(mapLayer);
    r.stops.forEach((s,i)=>{const o=OUT(s.oid);L.marker([o.lat,o.lng],{icon:L.divIcon({className:'',html:`<div class="stopnum">${i+1}</div>`,iconSize:[20,20],iconAnchor:[10,26]}),interactive:false}).addTo(mapLayer)});
  }
  list.forEach(o=>{
    const s=SALE(o.saleId);
    const m=L.marker([o.lat,o.lng],{icon:L.divIcon({className:'',html:`<div class="mk ${o.saleId?'':'un'}" style="--c:${colorFor(o)}"><b></b><span style="--s:${s?s.color:'#dc2626'}">${s?s.short:'Chưa có Sale'}</span></div>`,iconSize:[14,14],iconAnchor:[7,7]})});
    m.bindPopup(()=>popupHtml(o),{maxWidth:300});m.addTo(mapLayer);
  });
  if(S.mf.showSales){
    todayStats(scopeActive()).filter(x=>x.last).forEach(x=>{
      const o=OUT(x.last.oid);
      L.marker([o.lat+0.0009,o.lng],{zIndexOffset:1000,icon:L.divIcon({className:'',html:`<div class="salepin" style="--c:${x.s.color}">${x.s.short}</div>`,iconSize:[30,30],iconAnchor:[15,15]})})
       .bindTooltip(`<b>${x.s.name}</b><br>${x.open?'Đang visit':'Check-in gần nhất'}: ${fmtT(x.last.inM)} – ${esc(o.name)}<br>Tiến độ tuyến: ${x.done}/${x.planned}`,{direction:'top',offset:[0,-14]}).addTo(mapLayer);
    });
  }
  if(fit&&list.length){MAP.fitBounds(L.latLngBounds(list.map(o=>[o.lat,o.lng])).pad(0.15),{maxZoom:15})}
}
function popupHtml(o){
  const na=o.open[0];
  return `<div class="pop"><h5>${esc(o.name)}</h5><div class="row">${stPill(o)} ${carePill(o)}</div>
  <div class="kv"><span>Mã</span><b>${o.code}</b><span>Địa chỉ</span><span style="color:inherit">${esc(o.addr)}</span><span>Sale</span>${o.saleId?esc(SALE(o.saleId).name):'<b style="color:#dc2626">Chưa phân bổ</b>'}<span>Tuyến</span><span style="color:inherit">${routeNames(o)}</span>
  <span>Lần ghé gần nhất</span><span style="color:inherit">${lastTxt(o)}</span><span>Số lần đã ghé</span><b>${o.visitCount}</b>
  <span>Next Action</span><span style="color:inherit">${na?`${esc(na.title)} · hạn ${fmtD(na.due)}${na.due<TODAY?' <b style="color:#dc2626">(quá hạn)</b>':''}`:'—'}</span></div>
  <button class="btn sm p" onclick="openOutlet('${o.id}')">Xem timeline & chi tiết</button></div>`;
}

function routeHistory(r,n){
  const out=[];
  for(let b=0;b<=n;b++){const d=dAdd(TODAY,-b);if(!r.days.includes(d.getDay()))continue;
    const done=visits.filter(v=>v.rid===r.id&&sameDay(v.date,d)&&v.outM!=null),sk=skips.filter(k=>k.rid===r.id&&sameDay(k.date,d));
    const planned=b===0?r.stops.length:done.length+sk.length;
    out.push({d,done,sk,planned,today:b===0,who:done[0]?.sid||sk[0]?.sid||r.saleId});}
  return out;
}
function routeRate(r,n=28){const h=routeHistory(r,n).filter(x=>!x.today);const p=h.reduce((a,x)=>a+x.planned,0),d=h.reduce((a,x)=>a+x.done.length,0);return p?Math.round(d/p*100):0}

    <div class="card" style="margin-top:14px"><h3>Hai mô hình vận hành</h3><div class="small"><p style="margin:0 0 6px"><b>Tuyến cố định:</b> Manager tạo tuyến, gán Sale, thứ tự điểm, điểm bắt buộc. Hệ thống ghi nhận điểm đã ghé / bỏ qua + lý do.</p><p style="margin:0 0 6px"><b>Đi tự do:</b> Sale tự chọn điểm theo tình hình thị trường – ghi nhận “Ngoài tuyến”.</p><p style="margin:0"><b>Điểm ngoài tuyến:</b> Sale tạo outlet mới từ GPS ngay tại chỗ.</p></div></div>

    const pts=r.stops.map(s=>OUT(s.oid)).map(o=>[o.lat,o.lng]);
    if(pts.length){L.polyline(pts,{color:SALE(r.saleId).color,weight:4,opacity:.75}).addTo(routeMap);
      r.stops.forEach((s,i)=>{const o=OUT(s.oid);L.marker([o.lat,o.lng],{icon:L.divIcon({className:'',html:`<div class="stopnum" style="background:${s.req?'#1a5276':'#94a3b8'}">${i+1}</div>`,iconSize:[20,20],iconAnchor:[10,10]})}).bindTooltip(o.name).addTo(routeMap)});
      routeMap.fitBounds(L.latLngBounds(pts).pad(0.2))}else routeMap.setView(DIST[r.name.replace(/ \d+$/,'')]?.c||[21.02,105.82],13);

    </tbody></table></div></div>`;
}
function moveStop(rid,i,d){const r=ROUTE(rid),[x]=r.stops.splice(i,1);r.stops.splice(i+d,0,x);reindex();go('routes')}

function rCalendar(c){
  const mon=dAdd(TODAY,-((TODAY.getDay()+6)%7)+S.calWeek*7),days=[...Array(7)].map((_,i)=>dAdd(mon,i));
  const sids=scopeActive();
  let cells='';
  sids.forEach(id=>{const s=SALE(id);
    cells+=`<div><div class="schip b"><i style="background:${s.color}"></i>${s.name}</div><div class="muted small">${TEAMS[s.team].name}</div></div>`;
    days.forEach(d=>{
      const isT=sameDay(d,TODAY),past=d<TODAY&&!isT,wd=d.getDay();
      if(wd===0){cells+=`<div class="muted small ${isT?'today-col':''}">Nghỉ</div>`;return}
      const rs=routes.filter(r=>r.saleId===id&&r.days.includes(wd));
      const free=visits.filter(v=>v.sid===id&&!v.rid&&sameDay(v.date,d)).length;
      let h='';
      rs.forEach(r=>{
        const done=visits.filter(v=>v.rid===r.id&&sameDay(v.date,d)&&v.outM!=null).length,sk=skips.filter(k=>k.rid===r.id&&sameDay(k.date,d)).length;
        if(d>TODAY){h+=`<div class="cblk" style="--c:#94a3b8"><b>${esc(r.name)}</b><span class="muted">Kế hoạch ${r.stops.length} điểm</span></div>`;return}
        const plan=isT?r.stops.length:done+sk,p=plan?done/plan:0,col=isT?'#2e86c1':p>=.85?'#16a34a':p>=.7?'#d97706':'#dc2626';
        if(!isT&&!plan&&d<dAdd(TODAY,-42)){h+=`<div class="cblk" style="--c:#cbd5e1"><b>${esc(r.name)}</b><span class="muted">Ngoài phạm vi dữ liệu demo</span></div>`;return}
        h+=`<div class="cblk" style="--c:${col}"><b>${esc(r.name)}</b>${isT?'Đang chạy ':''}${done}/${plan} điểm${sk?` · <span style="color:var(--bad)">${sk} bỏ qua</span>`:''}</div>`;
      });
      if(free)h+=`<div class="small" style="color:#7c3aed">+ ${free} visit tự do</div>`;
      cells+=`<div class="cc ${isT?'today-col':''}" onclick="calDay('${id}',${d.getTime()})">${h||'<span class="muted small">—</span>'}</div>`;
    });
  });
  c.innerHTML=`<div class="row" style="margin-bottom:12px"><button class="btn sm" onclick="S.calWeek--;go('calendar')" ${S.calWeek<=-5?'disabled':''}>‹ Tuần trước</button><b>Tuần ${fmtD(days[0])} – ${fmtD(days[6])}/${days[6].getFullYear()}</b><button class="btn sm" onclick="S.calWeek++;go('calendar')" ${S.calWeek>=2?'disabled':''}>Tuần sau ›</button>${S.calWeek?`<button class="btn sm" onclick="S.calWeek=0;go('calendar')">Tuần này</button>`:''}
    <span style="flex:1"></span><span class="small row">${pill('#16a34a','≥ 85%')} ${pill('#d97706','70–85%')} ${pill('#dc2626','< 70%')} ${pill('#2e86c1','Đang chạy')} ${pill('#94a3b8','Kế hoạch')}</span></div>
   <div class="cal"><div class="ch">Sale</div>${days.map(d=>`<div class="ch ${sameDay(d,TODAY)?'today':''}">${WDL[d.getDay()]}<br><span style="font-weight:400">${fmtD(d)}</span></div>`).join('')}${cells}</div>
   <p class="muted small">Bấm vào một ô để xem chi tiết visit trong ngày của Sale.</p>`;
}
function calDay(sid,ts){
  const d=new Date(ts),vs=visits.filter(v=>v.sid===sid&&sameDay(v.date,d)).sort((a,b)=>a.inM-b.inM),sk=skips.filter(k=>k.sid===sid&&sameDay(k.date,d));
  const rs=routes.filter(r=>r.saleId===sid&&r.days.includes(d.getDay()));
  const plan=d>TODAY?rs.flatMap(r=>r.stops.map((s,i)=>`<div class="li"><span class="sn">${i+1}</span><div style="flex:1">${esc(OUT(s.oid).name)}<div class="muted small">${esc(r.name)}</div></div></div>`)).join(''):'';
  openModal(`${SALE(sid).name} · ${WDL[d.getDay()]} ${fmtDY(d)}`,
    (plan?`<b>Kế hoạch tuyến</b>${plan}`:'')+
    (vs.length?vs.map(v=>visitCard(v,true)).join(''):d<=TODAY?'<div class="muted">Không có visit</div>':'')+
    (sk.length?`<b>Điểm bỏ qua</b>`+sk.map(k=>`<div class="li"><div style="flex:1">${esc(OUT(k.oid).name)}</div><span class="flag">${esc(k.reason)}</span></div>`).join(''):''),
    `<button class="btn" onclick="closeModal()">Đóng</button>`);
}

/* ============================================================
   05 · KHÁCH HÀNG / ĐIỂM BÁN

function rOutlets(c){
  const f=S.of,outs=scopeOutlets();
  const tabs=`<div class="tabs"><button class="${f.tab==='outlets'?'on':''}" onclick="S.of.tab='outlets';go('outlets')">Điểm bán / Outlet (${outs.length})</button><button class="${f.tab==='customers'?'on':''}" onclick="S.of.tab='customers';go('outlets')">Khách hàng (CRM)</button></div>`;
  if(f.tab==='customers'){
    const cs=customers.map(cu=>({cu,os:outs.filter(o=>o.cid===cu.id)})).filter(x=>x.os.length).sort((a,b)=>b.os.length-a.os.length);
    c.innerHTML=tabs+`<p class="muted small">Một khách hàng có thể có nhiều điểm bán; hoạt động DMS ghi nhận tại từng điểm bán cụ thể.</p><div class="tbl"><table class="t"><thead><tr><th>Khách hàng</th><th>Loại</th><th>Liên hệ</th><th class="num">Số điểm bán</th><th>Sale phụ trách</th><th class="num">Tổng visit</th><th>Ghé gần nhất</th></tr></thead><tbody>
     ${cs.map(({cu,os})=>{const l=os.map(o=>o.last).filter(Boolean).sort((a,b)=>vTs(b)-vTs(a))[0];return `<tr class="click" onclick="openOutlet('${os[0].id}','info')"><td><b>${esc(cu.name)}</b>${os.length>1?`<div class="muted small">${os.map(o=>esc(o.name)).join(' · ')}</div>`:''}</td><td>${cu.kind}<div class="muted small">${cu.group}</div></td><td>${esc(cu.contact)}<div class="muted small">${cu.phone}</div></td><td class="num">${os.length}</td><td>${[...new Set(os.map(o=>o.saleId))].map(schip).join('<br>')}</td><td class="num">${os.reduce((a,o)=>a+o.visitCount,0)}</td><td>${l?fmtD(l.date):'—'}</td></tr>`}).join('')}</tbody></table></div>`;
    return;
  }
  let list=outs;
  if(f.q){const q=f.q.toLowerCase();list=list.filter(o=>(o.name+o.addr+o.code+o.contact).toLowerCase().includes(q))}
  if(f.status)list=list.filter(o=>o.status===f.status);
  if(f.sale)list=list.filter(o=>f.sale==='none'?!o.saleId:o.saleId===f.sale);
  if(f.area)list=list.filter(o=>o.district===f.area);
  if(f.care)list=list.filter(o=>o.care===f.care);
  const ss=scopeActive().map(SALE),areas=[...new Set(outs.map(o=>o.district))];
  const o_=(k,arr)=>arr.map(([v,l])=>`<option value="${v}" ${f[k]===v?'selected':''}>${l}</option>`).join('');
  c.innerHTML=tabs+`<div class="row" style="margin-bottom:12px">
    <input style="width:240px" placeholder="Tìm tên, mã, địa chỉ, người liên hệ…" value="${esc(f.q)}" onchange="S.of.q=this.value;go('outlets')">
    <select onchange="S.of.status=this.value;go('outlets')"><option value="">Trạng thái</option>${o_('status',Object.entries(STATUS).map(([k,v])=>[k,v.l]))}</select>
    <select onchange="S.of.care=this.value;go('outlets')"><option value="">Tình trạng chăm sóc</option>${o_('care',Object.entries(CARE).map(([k,v])=>[k,v.l]))}</select>
    <select onchange="S.of.sale=this.value;go('outlets')"><option value="">Sale</option>${o_('sale',ss.map(s=>[s.id,s.name]).concat(S.role==='admin'?[['none','— Chưa có Sale —']]:[]))}</select>
    <select onchange="S.of.area=this.value;go('outlets')"><option value="">Khu vực</option>${o_('area',areas.map(a=>[a,a]))}</select>
    <span style="flex:1"></span>
    ${canManage()?`<button class="btn sm" ${S.sel.size?'':'disabled'} onclick="openAssign([...S.sel])">${ic('swap',14)} Phân bổ Sale (${S.sel.size})</button>`:''}
    <button class="btn sm" onclick="exportCSV('diem_ban',outletRows())">${ic('dl',14)} Xuất Excel</button>
    <button class="btn sm p" onclick="S.m.view='newOutlet';go('mobile')">${ic('plus',14)} Thêm điểm bán</button></div>
  <div class="tbl" style="max-height:calc(100vh - 230px)"><table class="t"><thead><tr>${canManage()?`<th><input type="checkbox" onchange="selAll(this.checked)"></th>`:''}<th>Điểm bán</th><th>Khu vực</th><th>Trạng thái</th><th>Sale phụ trách</th><th>Tuyến</th><th>Ghé gần nhất</th><th class="num">Số lần</th><th>Chăm sóc</th><th>Next Action</th></tr></thead><tbody>
  ${list.map(o=>`<tr class="click" onclick="openOutlet('${o.id}')">${canManage()?`<td onclick="event.stopPropagation()"><input type="checkbox" ${S.sel.has(o.id)?'checked':''} onchange="selOne('${o.id}',this.checked)"></td>`:''}
   <td><b>${esc(o.name)}</b><div class="muted small">${o.code} · ${esc(o.type)}</div></td><td>${o.district}</td><td>${stPill(o)}</td><td>${schip(o.saleId)}</td><td class="small">${routeNames(o)}</td><td>${lastTxt(o)}</td><td class="num">${o.visitCount}</td><td>${carePill(o)}</td>
   <td class="small">${o.open[0]?`${esc(o.open[0].title)}<div class="${o.open[0].due<TODAY?'':'muted'}" style="${o.open[0].due<TODAY?'color:var(--bad)':''}">hạn ${fmtD(o.open[0].due)}</div>`:'<span class="muted">—</span>'}</td></tr>`).join('')||`<tr><td colspan="10" class="empty">Không có điểm bán phù hợp</td></tr>`}
  </tbody></table></div>`;
  window._outList=list;
}
function selOne(id,on){on?S.sel.add(id):S.sel.delete(id);go('outlets')}
function selAll(on){(window._outList||[]).forEach(o=>on?S.sel.add(o.id):S.sel.delete(o.id));go('outlets')}
function outletRows(){return [['Mã','Tên','Loại','Khu vực','Địa chỉ','Trạng thái','Sale','Tuyến','Ghé gần nhất','Số lần ghé','Chăm sóc','Lat','Lng']].concat((window._outList||[]).map(o=>[o.code,o.name,o.type,o.district,o.addr,STATUS[o.status].l,o.saleId?SALE(o.saleId).name:'',o.routeIds.map(i=>ROUTE(i).name).join('; '),o.last?fmtDY(o.last.date):'',o.visitCount,CARE[o.care].l,o.lat.toFixed(6),o.lng.toFixed(6)]))}
function exportCSV(name,rows){
  const csv='﻿'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`DMS_${name}_${fmtD(TODAY).replace('/','')}.csv`;a.click();
}

/* ============================================================
   06 · NHẬT KÝ THỊ TRƯỜNG
   ============================================================ */
function rJournal(c){
  const f=S.jf,range=+f.range,from=dAdd(TODAY,-(range-1));
  const okS=sid=>inScopeSale(sid)&&(!f.sale||sid===f.sale);
  const okA=oid=>!f.area||OUT(oid).district===f.area;
  let ev=[];
  if(!f.type||f.type==='visit')visits.forEach(v=>{if(v.date>=from&&okS(v.sid)&&okA(v.oid)&&(!f.flag||v.flags.length))ev.push({ts:vTs(v),h:()=>visitCard(v,true)})});
  if(!f.flag){
  if(!f.type||f.type==='skip')skips.forEach(k=>{if(k.date>=from&&okS(k.sid)&&okA(k.oid))ev.push({ts:k.date.getTime()+k.atM*60000,h:()=>`<div class="ev sys"><div class="ev-h">${pill('#dc2626','Bỏ qua điểm',false)}<b style="cursor:pointer" onclick="openOutlet('${k.oid}')">${esc(OUT(k.oid).name)}</b>${schip(k.sid)}<span>Tuyến ${ROUTE(k.rid).name} – ${esc(k.reason)}</span><span class="dt">${fmtD(k.date)} ${fmtT(k.atM)}</span></div></div>`})});
  if(!f.type||f.type==='newoutlet')outlets.forEach(o=>{if(o.source==='field'&&o.created>=from&&okS(o.createdBy)&&okA(o.id))ev.push({ts:o.created.getTime()+15*3600e3,h:()=>`<div class="ev sys"><div class="ev-h">${pill('#7c3aed','Điểm mới ngoài tuyến',false)}<b style="cursor:pointer" onclick="openOutlet('${o.id}')">${esc(o.name)}</b>${schip(o.createdBy)}<span class="muted">${esc(o.addr)} · GPS ${o.lat.toFixed(5)}, ${o.lng.toFixed(5)}</span><span class="dt">${fmtD(o.created)}</span></div></div>`})});
  if(!f.type||f.type==='handover')handovers.forEach(h=>{if(h.date>=from&&(okS(h.to)||okS(h.from))&&okA(h.oid))ev.push({ts:h.date.getTime()+9*3600e3,h:()=>`<div class="ev sys"><div class="ev-h">${pill('#1a5276','Bàn giao',false)}<b style="cursor:pointer" onclick="openOutlet('${h.oid}')">${esc(OUT(h.oid).name)}</b>${schip(h.from)} → ${schip(h.to)}<span class="muted">${esc(h.reason)}</span><span class="dt">${fmtD(h.date)}</span></div></div>`})});
  }
  ev.sort((a,b)=>b.ts-a.ts);
  const vsN=visits.filter(v=>v.date>=from&&okS(v.sid)&&okA(v.oid));
  const areas=[...new Set(scopeOutlets().map(o=>o.district))];
  const o_=(k,arr)=>arr.map(([v,l])=>`<option value="${v}" ${f[k]===v?'selected':''}>${l}</option>`).join('');
  c.innerHTML=`<div class="row" style="margin-bottom:12px">
   <select onchange="S.jf.range=this.value;S.jf.limit=40;go('journal')">${o_('range',[['1','Hôm nay'],['7','7 ngày'],['30','30 ngày']])}</select>
   <select onchange="S.jf.sale=this.value;go('journal')"><option value="">Tất cả Sale</option>${o_('sale',scopeSales().map(id=>[id,SALE(id).name]))}</select>
   <select onchange="S.jf.area=this.value;go('journal')"><option value="">Tất cả khu vực</option>${o_('area',areas.map(a=>[a,a]))}</select>
   <select onchange="S.jf.type=this.value;go('journal')"><option value="">Mọi loại sự kiện</option>${o_('type',[['visit','Visit (check-in/out, note)'],['skip','Bỏ điểm trên tuyến'],['newoutlet','Tạo điểm ngoài tuyến'],['handover','Bàn giao Sale']])}</select>
   <label class="row small"><input type="checkbox" ${f.flag?'checked':''} onchange="S.jf.flag=this.checked;go('journal')"> Chỉ visit cần duyệt GPS</label>
   <span style="flex:1"></span><span class="small muted">${vsN.length} visit · ${vsN.filter(v=>!v.rid).length} ngoài tuyến · TB ${Math.round(vsN.filter(v=>v.outM).reduce((a,v)=>a+v.outM-v.inM,0)/Math.max(1,vsN.filter(v=>v.outM).length))} phút/visit</span></div>
   <div style="max-width:980px">${ev.slice(0,f.limit).map(e=>e.h()).join('')||'<div class="card empty">Không có hoạt động</div>'}
   ${ev.length>f.limit?`<div style="text-align:center"><button class="btn" onclick="S.jf.limit+=40;go('journal')">Xem thêm (${ev.length-f.limit})</button></div>`:''}</div>`;
}

   07 · BÁO CÁO
   ============================================================ */
function rReports(c){
  if(S.role==='sale'){c.innerHTML=`<div class="card empty">Báo cáo quản trị dành cho Trưởng nhóm và Quản lý.<br>Sale xem kết quả cá nhân ở màn hình Tổng quan.</div>`;return}
  const p=S.rp,from=dAdd(TODAY,-(p.period-1)),sids=scopeActive(),outs=scopeOutlets();
  const vs=visits.filter(v=>v.date>=from&&inScopeSale(v.sid));
  let body='',rows=[];
  if(p.tab==='sale'){
    const data=sids.map(id=>{const s=SALE(id),my=vs.filter(v=>v.sid===id),rv=my.filter(v=>v.rid&&v.outM!=null&&!sameDay(v.date,TODAY)),sk=skips.filter(k=>k.sid===id&&k.date>=from&&!sameDay(k.date,TODAY));
      const fin=my.filter(v=>v.outM!=null),dur=fin.length?Math.round(fin.reduce((a,v)=>a+v.outM-v.inM,0)/fin.length):0;
      const workDays=new Set(my.map(v=>v.date.getTime())).size;
      return {s,n:my.length,perDay:workDays?(my.length/workDays).toFixed(1):'0',rate:rv.length+sk.length?Math.round(rv.length/(rv.length+sk.length)*100):0,
        newO:outlets.filter(o=>o.source==='field'&&o.createdBy===id&&o.created>=from).length,gps:my.length?Math.round(my.filter(v=>!v.flags.length).length/my.length*100):100,dur,
        orders:orders.filter(x=>x.sid===id&&x.date>=from).length,forgot:outlets.filter(o=>o.saleId===id&&o.care==='overdue').length,od:actions.filter(a=>a.sid===id&&a.status==='open'&&a.due<TODAY).length}});
    const mx=Math.max(...data.map(d=>d.n),1);
    rows=[['Sale','Số visit','Visit/ngày','Hoàn thành tuyến %','Khách mới tạo','GPS hợp lệ %','Thời lượng TB (phút)','Đơn hàng','Khách lâu chưa ghé','Next Action quá hạn']].concat(data.map(d=>[d.s.name,d.n,d.perDay,d.rate,d.newO,d.gps,d.dur,d.orders,d.forgot,d.od]));
    body=`<div class="g2"><div class="tbl"><table class="t"><thead><tr><th>Sale</th><th class="num">Visit</th><th class="num">Visit/ngày</th><th class="num">HT tuyến</th><th class="num">KH mới</th><th class="num">GPS hợp lệ</th><th class="num">TB phút</th><th class="num">Đơn</th><th class="num">Lâu chưa ghé</th><th class="num">NA quá hạn</th></tr></thead><tbody>
      ${data.map(d=>`<tr><td>${schip(d.s.id)}</td><td class="num b">${d.n}</td><td class="num">${d.perDay}</td><td class="num" style="color:${d.rate>=85?'#16a34a':d.rate>=70?'#d97706':'#dc2626'}">${d.rate}%</td><td class="num">${d.newO}</td><td class="num">${d.gps}%</td><td class="num">${d.dur}</td><td class="num">${d.orders}</td><td class="num">${d.forgot}</td><td class="num" style="${d.od?'color:var(--bad)':''}">${d.od}</td></tr>`).join('')}</tbody></table></div>
      <div class="card"><h3>Số visit theo Sale</h3>${data.map(d=>`<div class="hbar"><span>${d.s.name}</span><div class="bar"><i style="width:${d.n/mx*100}%;background:${d.s.color}"></i></div><span class="small b">${d.n}</span></div>`).join('')}</div></div>`;
  }else if(p.tab==='coverage'){
    const areas=[...new Set(outs.map(o=>o.district))];
    const def={assigned:'Điểm có Sale phụ trách / Tổng điểm',visited:`Điểm đã ghé trong ${p.period} ngày / Tổng điểm`,freq:'Điểm được chăm sóc đúng tần suất / Tổng điểm'};
    const data=areas.map(a=>{const ao=outs.filter(o=>o.district===a),av=vs.filter(v=>OUT(v.oid).district===a);
      const assigned=ao.filter(o=>o.saleId).length,visited=ao.filter(o=>o.visits.some(v=>v.date>=from)).length,freq=ao.filter(o=>o.care==='ok').length;
      const cov={assigned,visited,freq}[p.cov];
      return {a,n:ao.length,sales:new Set(ao.map(o=>o.saleId).filter(Boolean)).size,assigned,visited,freq,freqAvg:(av.length/Math.max(1,ao.length)/(p.period/7)).toFixed(2),uncovered:ao.length-cov,pct:Math.round(cov/Math.max(1,ao.length)*100)}});
    const tot=data.reduce((s,d)=>({n:s.n+d.n,c:s.c+(d.n-d.uncovered)}),{n:0,c:0});
    rows=[['Khu vực','Số điểm bán','Số Sale','Có Sale','Đã ghé','Đúng tần suất','Tần suất ghé (lần/điểm/tuần)','Điểm chưa phủ','Độ phủ %']].concat(data.map(d=>[d.a,d.n,d.sales,d.assigned,d.visited,d.freq,d.freqAvg,d.uncovered,d.pct]));
    body=`<div class="card" style="margin-bottom:16px"><div class="row"><b>Định nghĩa độ phủ (cần chốt trong BRD):</b>${Object.entries(def).map(([k,l])=>`<button class="chip ${p.cov===k?'on':''}" onclick="S.rp.cov='${k}';go('reports')">${l}</button>`).join('')}</div>
      <div style="margin-top:10px;font-size:22px;font-weight:700">${Math.round(tot.c/Math.max(1,tot.n)*100)}% <span class="small muted" style="font-weight:400">độ phủ toàn phạm vi · ${tot.c}/${tot.n} điểm</span></div></div>
      <div class="g2"><div class="tbl"><table class="t"><thead><tr><th>Khu vực</th><th class="num">Điểm bán</th><th class="num">Số Sale</th><th class="num">Có Sale</th><th class="num">Đã ghé</th><th class="num">Đúng tần suất</th><th class="num">Tần suất ghé</th><th class="num">Chưa phủ</th></tr></thead><tbody>
      ${data.map(d=>`<tr class="click" onclick="gotoMap({area:'${d.a}'})"><td>${d.a}</td><td class="num">${d.n}</td><td class="num">${d.sales}</td><td class="num">${d.assigned}</td><td class="num">${d.visited}</td><td class="num">${d.freq}</td><td class="num">${d.freqAvg}</td><td class="num" style="${d.uncovered?'color:var(--bad)':''}">${d.uncovered}</td></tr>`).join('')}</tbody></table></div>
      <div class="card"><h3>Độ phủ theo khu vực</h3>${data.sort((a,b)=>b.pct-a.pct).map(d=>`<div class="hbar"><span>${d.a}</span><div class="bar"><i style="width:${d.pct}%;background:${d.pct>=70?'#16a34a':d.pct>=50?'#d97706':'#dc2626'}"></i></div><span class="small b">${d.pct}%</span></div>`).join('')}</div></div>`;
  }else if(p.tab==='route'){
    const rs=routes.filter(r=>inScopeSale(r.saleId));
    const data=rs.map(r=>{const h=routeHistory(r,p.period).filter(x=>!x.today);const pl=h.reduce((a,x)=>a+x.planned,0),dn=h.reduce((a,x)=>a+x.done.length,0);
      const reasons={};h.forEach(x=>x.sk.forEach(k=>reasons[k.reason]=(reasons[k.reason]||0)+1));
      return {r,runs:h.length,pl,dn,sk:pl-dn,rate:pl?Math.round(dn/pl*100):0,top:Object.entries(reasons).sort((a,b)=>b[1]-a[1])[0]}});

function gpsCheck(){

  notify('checkin',`An vừa check-in tại ${o.name} – ${fmtT(v.inM)} – ${o.district}${inR?'':' (ngoài tuyến)'}`,o.id,ME);
  if(flags.length)notify('gps',`Check-in của An tại ${o.name}: ${flags.join(', ')} (${m.dist}m) – cần duyệt`,o.id,ME);

}
const mElapsed=()=>Math.max(1,Math.floor((Date.now()-S.m.start)/1000)+S.m.bonus);
function mSaveNote(){const v=visits.find(x=>x.id===S.m.vid);v.note=$('#mnote').value.trim();if(v.note)notify('note',`An cập nhật note tại ${OUT(v.oid).name}: “${v.note.slice(0,60)}${v.note.length>60?'…':''}”`,v.oid,ME);refresh()}
function mOutcome(x){const n=$('#mnote');if(n){visits.find(v=>v.id===S.m.vid).note=n.value}S.m.outcome=x;S.m.na=!!ACTION_OF[x]||x==='Đặt hàng'?!!ACTION_OF[x]:false;S.m.naTitle=ACTION_OF[x]||'';renderPhone()}
function mCheckout(){
  const m=S.m,v=visits.find(x=>x.id===m.vid),o=OUT(v.oid);
  const n=$('#mnote');if(n)v.note=n.value.trim();
  const dur=mElapsed();v.outM=v.inM+dur;v.outcome=m.outcome;
  if(dur<S.cfg.minDur)v.flags.push('Visit quá ngắn');
  if(m.na&&(m.naTitle||$('#naTitle')?.value)){const t=$('#naTitle')?.value||m.naTitle,[y,mo,d]=($('#naDue')?.value||m.naDue||'2026-09-28').split('-').map(Number);
    actions.push({id:'a'+(++aid),oid:o.id,vid:v.id,sid:ME,title:t,due:new Date(y,mo-1,d),status:'open',created:TODAY});v.aid='a'+aid}
  if(v.outcome==='Đặt hàng')orders.push({id:'SO-0925-'+String(++ordN).padStart(4,'0'),oid:o.id,vid:v.id,sid:ME,date:TODAY,amount:rint(20,150)*100000,items:rint(3,10),status:'Chờ duyệt'});
  S.simMin=v.outM;m.view='done';
  notify('checkout',`An hoàn thành visit ${o.name} – thời lượng ${dur} phút · Kết quả: ${v.outcome}`,o.id,ME);
  refresh();
}
function mSkip(){
  const m=S.m,o=OUT(m.oid),r=todayRoute(ME);
  skips.push({id:'k'+(++kid),date:TODAY,rid:r.id,oid:o.id,sid:ME,reason:m.skipReason,atM:S.simMin});
  notify('skip',`Điểm ${o.name} chưa được ghé theo tuyến ${r.name} ngày ${fmtD(TODAY)} – lý do: ${m.skipReason}`,o.id,ME);
  m.view='home';refresh();
}
function mCreateOutlet(){
  const name=$('#noName').value.trim();if(!name){$('#noName').focus();return}
  const p=curPos(),cu={id:'c'+(++cid),name:'Hộ KD '+name,kind:'Hộ kinh doanh',group:'Bán lẻ',contact:$('#noContact').value||'—',phone:$('#noPhone').value||'—'};customers.push(cu);
  const o={id:'o'+(++oi),code:'OL'+String(oi).padStart(4,'0'),name,type:$('#noType').value,district:'Cầu Giấy',addr:$('#noAddr').value,lat:p[0]+0.0012,lng:p[1]+0.0009,status:'new',saleId:ME,created:TODAY,cid:cu.id,phone:cu.phone,contact:cu.contact,source:'field',createdBy:ME};
  outlets.push(o);usedNames.add(name);
  notify('newoutlet',`An tạo điểm bán mới ngoài tuyến: ${name} (GPS) – Cầu Giấy`,o.id,ME);
  reindex();
  if($('#noCheck').checked){S.m.oid=o.id;S.m.dist=6;S.m.acc=9;S.m.farReason='';mCheckin()}else{S.m.view='home';refresh()}
}
