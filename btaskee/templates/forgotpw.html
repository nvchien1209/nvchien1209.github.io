{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu</title>
    <link rel="stylesheet" href="{% static 'vendors/bootstrap/bootstrap-5.3.3-dist/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/forgotpw.css' %}">
</head>
<body>
    <div class="container">
        <div class="forgot-password-container border-orange">
            <h1 class="forgot-password-header">Quên Mật Khẩu</h1>
            <p class="text-muted text-center mb-4">Nhập email của bạn để nhận mã xác nhận</p>
           
            <!-- Hiển thị thông báo -->
            {% if messages %}
            <div class="alert alert-{{ message.tags }}">
                {% for message in messages %}
                    <div>{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
           
            <form id="forgotPasswordForm" method="POST" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" class="form-control" id="email" name="email"
                           value="{{ email|default:'' }}" required>
                    <div class="invalid-feedback">
                        Vui lòng nhập email hợp lệ.
                    </div>
                </div>
                <button type="submit" class="btn btn-reset">Gửi Mã Xác Nhận</button>
            </form>
            
            <div class="forgot-password-footer">
                <p>Nhớ mật khẩu? <a href="{% url 'login' %}">Đăng nhập ngay!</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/forgotpw.js' %}"></script>
</body>
</html>
